<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f5ef">
<title>나의 첫 웹사이트 | Jade Studio</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f5ef;color:#182b29;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}header,main,footer{max-width:1120px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;letter-spacing:.06em}.tag{font-size:13px;border:1px solid #c8d0c7;border-radius:30px;padding:9px 14px}main{padding-top:60px}.eyebrow{font-size:12px;letter-spacing:.18em;color:#4d6a60}h1{font-size:clamp(42px,7vw,82px);line-height:1.15;letter-spacing:-.06em;margin:22px 0}p{line-height:1.8;color:#5b6861}.intro{max-width:640px}.art{margin-top:44px;border-radius:24px;overflow:hidden;background:#e5c9a1}.art svg{display:block;width:100%;height:auto}.caption{display:flex;justify-content:space-between;gap:16px;margin:14px 0 32px;font-size:13px;color:#5b6861}button{border:0;border-radius:40px;padding:17px 25px;background:#214e42;color:white;font:inherit;cursor:pointer}button:hover{background:#163a30}button:focus-visible{outline:3px solid #c26d37;outline-offset:4px}#result{min-height:32px;margin-top:16px}footer{border-top:1px solid #d9ded4;margin-top:36px;font-size:12px;color:#69766e}@media(max-width:600px){header,main,footer{padding:22px}main{padding-top:38px}.tag{font-size:11px}.caption{flex-direction:column;gap:4px}}
</style>
</head>
<body>
<header><span class="brand">JADE / STUDIO</span><span class="tag">나의 첫 웹사이트</span></header>
<main>
<div class="intro"><span class="eyebrow">HELLO, MY LITTLE WORLD</span><h1>상상하던 장면이,<br>웹페이지가 되다.</h1><p>작은 아이디어 하나로 시작한 나의 첫 공간.<br>이미지와 글을 담아 누구나 방문할 수 있는 웹사이트를 만들어 봅니다.</p></div>
<div class="art">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 550" role="img" aria-labelledby="art-title art-desc">
<title id="art-title">고요한 바다 위의 노을</title><desc id="art-desc">복숭아빛 하늘 아래 주황색 해가 떠 있고, 초록빛 산과 바다가 겹쳐지는 풍경 일러스트입니다.</desc>
<defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#efdcc0"/><stop offset="1" stop-color="#eeb895"/></linearGradient><linearGradient id="sea" x2="0" y2="1"><stop stop-color="#93b5a5"/><stop offset="1" stop-color="#335e56"/></linearGradient></defs>
<path fill="url(#sky)" d="M0 0h1200v550H0z"/><circle cx="815" cy="190" r="88" fill="#cf743f"/>
<path fill="#9ba98c" d="M0 350 170 215 350 352 533 270 755 410 1020 275 1200 370V550H0Z"/>
<path fill="url(#sea)" d="M0 373q250-35 600 0t600 0v177H0z"/>
<path fill="#345a4c" d="M0 290q145 20 242 155l94 105H0Z"/><path fill="#24483f" d="M1200 345q-150 22-235 205h235Z"/>
<g stroke="#ead9b3" stroke-width="3" stroke-linecap="round" opacity=".6"><path d="M735 410h155M770 433h85M680 460h250M740 492h130"/></g>
</svg>
</div>
<div class="caption"><span>01 — 고요한 바다, 새로운 시작</span><span>테스트용 일러스트 · 외부 이미지 없이 표시됩니다</span></div>
<button id="test" type="button">버튼도 작동할까요? ↗</button>
<p id="result" role="status" aria-live="polite">눌러서 웹페이지의 동작을 확인해 보세요.</p>
</main>
<footer>JADE STUDIO · GitHub Pages로 시작하는 첫 번째 웹사이트</footer>
<script>
document.getElementById('test').addEventListener('click',function(){
document.getElementById('result').textContent='잘 작동해요! 이미지와 버튼이 있는 나의 첫 웹페이지입니다.';
this.textContent='작동 확인 완료 ✓';
});
</script>
</body></html>
